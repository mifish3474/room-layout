<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Room 207 Layout</title>
<style>
body{margin:0;font-family:Arial;background:#f4f4f4}
h1{text-align:center;margin:10px}
#toolbar{display:flex;gap:8px;padding:10px;justify-content:center;flex-wrap:wrap;background:white;border-bottom:1px solid #ccc}
button{padding:8px 10px;cursor:pointer;border:1px solid #888;background:white;border-radius:6px}
#room{width:1200px;height:750px;margin:20px auto;position:relative;background:white;border:4px solid black;
background-image:linear-gradient(to right,#ddd 1px,transparent 1px),linear-gradient(to bottom,#ddd 1px,transparent 1px);
background-size:25px 25px}
.item{position:absolute;user-select:none;cursor:grab;border:2px solid #333;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;text-align:center;transform-origin:center}
.item:active{cursor:grabbing}
.desk{width:80px;height:45px;background:#8b5a2b;color:white}
.teacher{width:140px;height:60px;background:#1e5eff;color:white}
.table{width:120px;height:50px;background:#2aa84a;color:white}
.cabinet{width:130px;height:40px;background:#444;color:white}
.trash{width:45px;height:45px;background:#f0c400;color:black;border-radius:50%}
.wall{width:180px;height:14px;background:black;color:white}
.controls{position:absolute;top:-26px;right:0;display:flex;gap:3px}
.mini{font-size:10px;padding:2px 5px;background:white;color:black}
@media print{
  #toolbar,.controls{display:none!important}
  body{background:white}
  #room{margin:0;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .item{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style>
</head>
<body>

<h1>Room 207 Layout</h1>

<div id="toolbar">
<button onclick="addItem('wall')">Wall</button>
<button onclick="addItem('desk')">Student Desk</button>
<button onclick="addItem('teacher')">Teacher Desk</button>
<button onclick="addItem('table')">Rolling Table</button>
<button onclick="addItem('cabinet')">Cabinet</button>
<button onclick="addItem('trash')">Trash Can</button>
<button onclick="saveLayout()">Save</button>
<button onclick="loadLayout()">Load</button>
<button onclick="clearLayout()">Clear</button>
<button onclick="window.print()">Print</button>
</div>

<div id="room"></div>

<script>
const room=document.getElementById("room");
const labels={wall:"Wall",desk:"Desk",teacher:"Teacher",table:"Table",cabinet:"Cabinet",trash:"Trash"};

function addItem(type,x=80,y=80,r=0){
  const item=document.createElement("div");
  item.className="item "+type;
  item.dataset.type=type;
  item.dataset.rotation=r;
  item.style.left=x+"px";
  item.style.top=y+"px";
  item.style.transform=`rotate(${r}deg)`;
  item.innerHTML=`<div class="controls"><button class="mini rot">↻</button><button class="mini del">×</button></div><span>${labels[type]}</span>`;

  item.querySelector(".rot").onclick=e=>{
    e.stopPropagation();
    let nr=(Number(item.dataset.rotation)+15)%360;
    item.dataset.rotation=nr;
    item.style.transform=`rotate(${nr}deg)`;
  };

  item.querySelector(".del").onclick=e=>{
    e.stopPropagation();
    item.remove();
  };

  makeDraggable(item);
  room.appendChild(item);
}

function makeDraggable(el){
  let startX,startY,startLeft,startTop,dragging=false;

  el.addEventListener("pointerdown",e=>{
    if(e.target.tagName==="BUTTON")return;
    dragging=true;
    el.setPointerCapture(e.pointerId);
    startX=e.clientX;
    startY=e.clientY;
    startLeft=parseInt(el.style.left)||0;
    startTop=parseInt(el.style.top)||0;
    e.preventDefault();
  });

  el.addEventListener("pointermove",e=>{
    if(!dragging)return;
    let x=startLeft+(e.clientX-startX);
    let y=startTop+(e.clientY-startY);
    x=Math.round(x/25)*25;
    y=Math.round(y/25)*25;
    el.style.left=x+"px";
    el.style.top=y+"px";
  });

  el.addEventListener("pointerup",e=>{
    dragging=false;
    try{el.releasePointerCapture(e.pointerId)}catch{}
  });
}

function saveLayout(){
  const data=[...document.querySelectorAll(".item")].map(el=>({
    type:el.dataset.type,
    x:parseInt(el.style.left),
    y:parseInt(el.style.top),
    rotation:Number(el.dataset.rotation||0)
  }));
  localStorage.setItem("room207layout",JSON.stringify(data));
  alert("Saved");
}

function loadLayout(){
  room.innerHTML="";
  JSON.parse(localStorage.getItem("room207layout")||"[]").forEach(i=>addItem(i.type,i.x,i.y,i.rotation));
}

function clearLayout(){
  if(confirm("Clear layout?"))room.innerHTML="";
}
</script>

</body>
</html>
