<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Room Layout</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    h1 {
      text-align: center;
      margin: 10px;
    }

    #toolbar {
      display: flex;
      gap: 10px;
      padding: 10px;
      justify-content: center;
      flex-wrap: wrap;
      background: white;
      border-bottom: 1px solid #ccc;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
      border: 1px solid #888;
      background: white;
      border-radius: 6px;
    }

    #room {
      width: 1200px;
      height: 700px;
      margin: 20px auto;
      position: relative;
      background-color: white;
      border: 4px solid black;

      background-image:
        linear-gradient(to right, #ddd 1px, transparent 1px),
        linear-gradient(to bottom, #ddd 1px, transparent 1px);

      background-size: 25px 25px;
    }

    .item {
      position: absolute;
      cursor: move;
      user-select: none;
      border: 2px solid #333;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
    }

    .desk {
      width: 100px;
      height: 50px;
      background: #8b5a2b;
      color: white;
    }

    .teacher {
      width: 140px;
      height: 60px;
      background: #1e5eff;
      color: white;
    }

    .table {
      width: 120px;
      height: 50px;
      background: #2aa84a;
      color: white;
    }

    .cabinet {
      width: 120px;
      height: 40px;
      background: #444;
      color: white;
    }

    @media print {
      #toolbar {
        display: none;
      }

      body {
        background: white;
      }

      #room {
        margin: 0;
      }
    }
  </style>
</head>

<body>

<h1>Room 207 Layout</h1>

<div id="toolbar">
  <button onclick="addItem('desk')">Add Student Desk</button>
  <button onclick="addItem('teacher')">Add Teacher Desk</button>
  <button onclick="addItem('table')">Add Rolling Table</button>
  <button onclick="addItem('cabinet')">Add Cabinet</button>
  <button onclick="window.print()">Print</button>
</div>

<div id="room"></div>

<script>
  const room = document.getElementById("room");

  function addItem(type) {
    const item = document.createElement("div");

    item.classList.add("item", type);

    const labels = {
      desk: "Desk",
      teacher: "Teacher",
      table: "Table",
      cabinet: "Cabinet"
    };

    item.innerText = labels[type];

    item.style.left = "50px";
    item.style.top = "50px";

    makeDraggable(item);

    room.appendChild(item);
  }

  function makeDraggable(element) {
    let offsetX = 0;
    let offsetY = 0;
    let isDragging = false;

    element.addEventListener("mousedown", (e) => {
      isDragging = true;

      offsetX = e.clientX - element.offsetLeft;
      offsetY = e.clientY - element.offsetTop;
    });

    document.addEventListener("mousemove", (e) => {
      if (!isDragging) return;

      let x = e.clientX - offsetX;
      let y = e.clientY - offsetY;

      x = Math.round(x / 25) * 25;
      y = Math.round(y / 25) * 25;

      element.style.left = x + "px";
      element.style.top = y + "px";
    });

    document.addEventListener("mouseup", () => {
      isDragging = false;
    });
  }
</script>

</body>
</html>
