<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Layout</title>
<style>
:root{--grid:25px;--ink:#1f2937;--muted:#6b7280;--panel:#111827;--soft:#f3f4f6}
body{margin:0;font-family:Arial,sans-serif;background:#eef1f5;color:var(--ink)}
h1{text-align:center;margin:16px 0 8px}
#toolbar{position:sticky;top:0;z-index:3000;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px;background:#111827;box-shadow:0 3px 10px rgba(0,0,0,.22)}
.group{display:flex;gap:7px;align-items:center;flex-wrap:wrap;background:#1f2937;padding:8px 10px;border-radius:14px}
.label{font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:.06em;color:#cbd5e1;margin-right:2px}
button,input{padding:8px 10px;border:1px solid #cbd5e1;border-radius:10px;font-size:13px}
button{cursor:pointer;background:white}
button:hover{background:#e5e7eb}
input[type=color]{padding:3px;width:42px;height:34px}
#mapTitle{font-weight:bold;min-width:170px}
#room{width:1200px;height:1000px;margin:18px auto;position:relative;background:white;border:4px solid black;overflow:hidden;background-image:linear-gradient(to right,#ddd 1px,transparent 1px),linear-gradient(to bottom,#ddd 1px,transparent 1px);background-size:var(--grid) var(--grid)}
.item{position:absolute;user-select:none;cursor:grab;border:2px solid #333;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;text-align:center;transform-origin:center}
.wallLine{position:absolute;height:10px;background:black;transform-origin:left center;cursor:grab}
.handle{position:absolute;width:14px;height:14px;background:#ef4444;border-radius:50%;top:-2px;cursor:pointer}
.h1{left:-7px}.h2{right:-7px}
.controls{position:absolute;top:-30px;right:0;display:none;gap:3px}
.mini{font-size:11px;padding:2px 5px;background:white;color:black}
.resize{position:absolute;right:-8px;bottom:-8px;width:14px;height:14px;background:#ef4444;border-radius:50%;cursor:nwse-resize;display:none}
.length{position:absolute;bottom:-30px;left:0;background:white;border:1px solid #999;padding:3px 8px;font-size:12px;color:black;min-width:45px;z-index:20;white-space:nowrap;display:none}
.active .controls{display:flex}.active .resize,.active .length{display:block}
.swatch{width:18px;height:18px;border:1px solid #333;display:inline-block;vertical-align:middle;margin-right:4px}
#classSeatsPromo{
  position:fixed;
  bottom:10px;
  right:10px;
  background:rgba(255,255,255,.9);
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:8px 12px;
  font-size:11px;
  color:#6b7280;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
  z-index:5000;
}

#classSeatsPromo a{
  color:#4f46e5;
  text-decoration:none;
  font-weight:bold;
}

#classSeatsPromo a:hover{
  text-decoration:underline;
}

@media print{
  #classSeatsPromo{
    display:none;
  }
}
 #legend{display:flex;gap:12px;padding:12px;justify-content:center;flex-wrap:wrap;background:white;border-top:1px solid #ddd}
.guideV,.guideH{position:absolute;background:#ef4444;pointer-events:none;display:none;z-index:999}
.guideV{width:2px;height:100%;left:50%;top:0}.guideH{height:2px;width:100%;top:50%;left:0}
@media print{
 #toolbar,.controls,.resize,.handle,.guideV,.guideH{display:none!important}
 body{background:white}
 #room,.item,.wallLine,#legend,.swatch{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .swatch{border:2px solid black!important}
}
</style>
</head>
<body>

<h1 id="titleDisplay">Room Layout</h1>

<div id="toolbar">
  <div class="group">
    <span class="label">Title</span>
    <input id="mapTitle" value="Room Layout" onchange="updateTitle()">
  </div>

  <div class="group">
    <button onclick="downloadLayout()">Save</button>
    <input id="fileLoader" type="file" accept=".json" style="display:none" onchange="loadFromFile(event)">
    <button onclick="document.getElementById('fileLoader').click()">Load</button>
  </div>

  <div class="group">
    <span class="label">Objects</span>
    <button onclick="addWall()">Wall</button>
    <button onclick="addItem('desk')">Desk</button>
    <button onclick="addItem('teacher')">Teacher</button>
    <button onclick="addItem('table')">Table</button>
    <button onclick="addItem('cabinet')">Cabinet</button>
    <button onclick="addItem('trash')">Trash</button>
    <button onclick="addTextBox()">Text</button>
  </div>

  <div class="group">
    <span class="label">Shapes</span>
    <button onclick="addItem('circleDesk')">Circle</button>
    <button onclick="addItem('semiDesk')">Semi</button>
    <button onclick="addItem('triangleDesk')">Triangle</button>
  </div>

  <div class="group">
    <span class="label">Custom</span>
    <input id="customName" placeholder="Name">
    <input id="customColor" type="color" value="#cc66ff">
    <button onclick="createCustom()">Add</button>
  </div>

  <div class="group">
    <span class="label">View</span>
    <button onclick="toggleMeasurements()">Measurements</button>
    <button onclick="clearLayout()">Clear</button>
    <button onclick="window.print()">Print</button>
  </div>
</div>

<div id="room">
  <div class="guideV"></div>
  <div class="guideH"></div>
</div>

<div id="legend"></div>

 <div id="classSeatsPromo">
  Built by Mr. Fish •
  <a href="https://app.classseats.app" target="_blank">
    Try ClassSeats
  </a>
  for seating charts, attendance, and student grouping.
</div>

<script>
const room=document.getElementById("room"),grid=25;
const guideV=document.querySelector(".guideV"),guideH=document.querySelector(".guideH");
let measurementsVisible=true;

let types={
 desk:{label:"Student Desk",w:100,h:50,color:"#8b5a2b",text:"white"},
 teacher:{label:"Teacher Desk",w:50,h:125,color:"#1e5eff",text:"white"},
 table:{label:"Rolling Table",w:125,h:50,color:"#2aa84a",text:"white"},
 cabinet:{label:"Cabinet",w:125,h:50,color:"#444",text:"white"},
 trash:{label:"Trash Can",w:50,h:50,color:"#f0c400",text:"black",shape:"circle"},
 textbox:{label:"Text Box",w:150,h:50,color:"#fff",text:"black"},
 circleDesk:{label:"Circle Desk",w:75,h:75,color:"#8b5a2b",text:"white",shape:"circle"},
 semiDesk:{label:"Semi Desk",w:100,h:50,color:"#8b5a2b",text:"white",shape:"semi"},
 triangleDesk:{label:"Triangle Desk",w:100,h:100,color:"#8b5a2b",text:"white",shape:"triangle"}
};

function snap(n){return Math.round(n/grid)*grid}
function activate(el){document.querySelectorAll(".active").forEach(e=>e.classList.remove("active"));el.classList.add("active")}
function showGuides(x,y){guideV.style.display=Math.abs(x-600)<8?"block":"none";guideH.style.display=Math.abs(y-500)<8?"block":"none"}
function hideGuides(){guideV.style.display="none";guideH.style.display="none"}

function addWall(x1=50,y1=50,x2=300,y2=50){
 const w=document.createElement("div");
 w.className="wallLine"; w.dataset.kind="wall";
 w.innerHTML=`<div class="controls"><button class="mini dup">⧉</button><button class="mini del">×</button></div><div class="handle h1"></div><div class="handle h2"></div><div class="length"></div>`;
 room.appendChild(w); setWall(w,x1,y1,x2,y2);
 w.querySelector(".del").onclick=e=>{e.stopPropagation();w.remove();updateLegend()};
 w.querySelector(".dup").onclick=e=>{e.stopPropagation();addWall(+w.dataset.x1+25,+w.dataset.y1+25,+w.dataset.x2+25,+w.dataset.y2+25)};
 dragWall(w); dragHandle(w,"h1"); dragHandle(w,"h2"); updateLegend();
}
function setWall(w,x1,y1,x2,y2){
 w.dataset.x1=x1;w.dataset.y1=y1;w.dataset.x2=x2;w.dataset.y2=y2;
 const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy),ang=Math.atan2(dy,dx)*180/Math.PI;
 w.style.left=x1+"px";w.style.top=(y1-5)+"px";w.style.width=len+"px";w.style.transform=`rotate(${ang}deg)`;
 w.querySelector(".length").textContent=Math.round(len/grid)+" ft";
}
function dragWall(w){
 let sx,sy,x1,y1,x2,y2,drag=false;
 w.addEventListener("pointerdown",e=>{
  if(e.target.tagName==="BUTTON"||e.target.classList.contains("handle"))return;
  drag=true;activate(w);w.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;
  x1=+w.dataset.x1;y1=+w.dataset.y1;x2=+w.dataset.x2;y2=+w.dataset.y2;e.preventDefault();
 });
 w.addEventListener("pointermove",e=>{if(!drag)return;let dx=snap(e.clientX-sx),dy=snap(e.clientY-sy);setWall(w,x1+dx,y1+dy,x2+dx,y2+dy);showGuides(x1+dx,y1+dy)});
 w.addEventListener("pointerup",e=>{drag=false;hideGuides();try{w.releasePointerCapture(e.pointerId)}catch{}});
}
function dragHandle(w,which){
 const h=w.querySelector("."+which);let drag=false;
 h.addEventListener("pointerdown",e=>{drag=true;activate(w);h.setPointerCapture(e.pointerId);e.stopPropagation()});
 h.addEventListener("pointermove",e=>{
  if(!drag)return;const r=room.getBoundingClientRect(),x=snap(e.clientX-r.left),y=snap(e.clientY-r.top);
  if(which==="h1")setWall(w,x,y,+w.dataset.x2,+w.dataset.y2);else setWall(w,+w.dataset.x1,+w.dataset.y1,x,y);
  showGuides(x,y);
 });
 h.addEventListener("pointerup",e=>{drag=false;hideGuides();try{h.releasePointerCapture(e.pointerId)}catch{}});
}

function applyShape(item,type){
 const shape=types[type]?.shape;
 item.style.borderRadius="0"; item.style.clipPath="none";
 if(shape==="circle")item.style.borderRadius="50%";
 if(shape==="semi")item.style.borderRadius="100px 100px 0 0";
 if(shape==="triangle")item.style.clipPath="polygon(50% 0%,0% 100%,100% 100%)";
}

function addItem(type,x=80,y=80,r=0,w=null,h=null,label=null,color=null){
 const t=types[type]||{label:label||"Custom",w:100,h:50,color:color||"#888",text:"white"};
 const item=document.createElement("div");
 item.className="item"; item.dataset.kind="item"; item.dataset.type=type; item.dataset.rotation=r;
 item.dataset.label=label||t.label; item.dataset.color=color||t.color;
 item.style.left=x+"px"; item.style.top=y+"px"; item.style.width=(w||t.w)+"px"; item.style.height=(h||t.h)+"px";
 item.style.background=color||t.color; item.style.color=t.text||"white"; item.style.transform=`rotate(${r}deg)`;
 item.innerHTML=`<div class="controls"><button class="mini rot">↻</button><button class="mini dup">⧉</button><button class="mini dim">⋮</button><button class="mini del">×</button></div><span>${label||t.label}</span><div class="resize"></div><div class="length"></div>`;
 applyShape(item,type);
 item.querySelector(".rot").onclick=e=>{e.stopPropagation();let nr=(+item.dataset.rotation+45)%360;item.dataset.rotation=nr;item.style.transform=`rotate(${nr}deg)`};
 item.querySelector(".dup").onclick=e=>{e.stopPropagation();addItem(type,parseInt(item.style.left)+25,parseInt(item.style.top)+25,+item.dataset.rotation,item.offsetWidth,item.offsetHeight,item.dataset.label,item.dataset.color)};
 item.querySelector(".del").onclick=e=>{e.stopPropagation();item.remove();updateLegend()};
 item.querySelector(".dim").onclick=e=>{e.stopPropagation();editDims(item)};
 makeDraggable(item);makeResizable(item);room.appendChild(item);updateLength(item);updateLegend();
}
function visualOffset(el){
 const w=el.offsetWidth,h=el.offsetHeight,r=((+el.dataset.rotation||0)%360)*Math.PI/180;
 const bw=Math.abs(w*Math.cos(r))+Math.abs(h*Math.sin(r)),bh=Math.abs(w*Math.sin(r))+Math.abs(h*Math.cos(r));
 return{ox:(w-bw)/2,oy:(h-bh)/2};
}
function makeDraggable(el){
 let sx,sy,startVisualX,startVisualY,drag=false;
 el.addEventListener("pointerdown",e=>{
  if(e.target.tagName==="BUTTON"||e.target.className==="resize")return;
  drag=true;activate(el);el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;
  const off=visualOffset(el);startVisualX=parseFloat(el.style.left)+off.ox;startVisualY=parseFloat(el.style.top)+off.oy;e.preventDefault();
 });
 el.addEventListener("pointermove",e=>{
  if(!drag)return;const off=visualOffset(el),visualX=snap(startVisualX+e.clientX-sx),visualY=snap(startVisualY+e.clientY-sy);
  el.style.left=(visualX-off.ox)+"px";el.style.top=(visualY-off.oy)+"px";showGuides(visualX,visualY);
 });
 el.addEventListener("pointerup",e=>{drag=false;hideGuides();try{el.releasePointerCapture(e.pointerId)}catch{}});
}
function makeResizable(el){
 const h=el.querySelector(".resize");let sx,sy,sw,sh,res=false;
 h.addEventListener("pointerdown",e=>{res=true;activate(el);sx=e.clientX;sy=e.clientY;sw=el.offsetWidth;sh=el.offsetHeight;h.setPointerCapture(e.pointerId);e.stopPropagation()});
 h.addEventListener("pointermove",e=>{if(!res)return;el.style.width=Math.max(grid,snap(sw+e.clientX-sx))+"px";el.style.height=Math.max(grid,snap(sh+e.clientY-sy))+"px";updateLength(el)});
 h.addEventListener("pointerup",e=>{res=false;try{h.releasePointerCapture(e.pointerId)}catch{}});
}
function updateLength(el){el.querySelector(".length").textContent=`${Math.round(el.offsetWidth/grid)}×${Math.round(el.offsetHeight/grid)} ft`}
function editDims(el){const w=prompt("Width in feet:",Math.round(el.offsetWidth/grid));if(!w)return;const h=prompt("Height in feet:",Math.round(el.offsetHeight/grid));if(!h)return;el.style.width=w*grid+"px";el.style.height=h*grid+"px";updateLength(el)}
function addTextBox(){const text=prompt("Label text:");if(text)addItem("textbox",80,80,0,150,50,text,"#fff")}
function createCustom(){const name=document.getElementById("customName").value.trim(),color=document.getElementById("customColor").value;if(!name)return alert("Name it first.");const key="custom_"+Date.now();types[key]={label:name,w:100,h:50,color,text:"white"};addItem(key,80,80,0,100,50,name,color)}

function updateLegend(){
 const used=[...document.querySelectorAll(".item")].map(i=>({label:i.dataset.label,color:i.dataset.color}));
 if(document.querySelector(".wallLine"))used.unshift({label:"Wall",color:"black"});
 const unique=[];used.forEach(u=>{if(!unique.find(x=>x.label===u.label&&x.color===u.color))unique.push(u)});
 document.getElementById("legend").innerHTML=unique.map(u=>`<span><span class="swatch" style="background:${u.color}"></span>${u.label}</span>`).join("");
}
function updateTitle(){const title=document.getElementById("mapTitle").value||"Room Layout";document.getElementById("titleDisplay").textContent=title}
function getLayoutData(){
 return{title:document.getElementById("mapTitle").value||"Room Layout",items:[...document.querySelectorAll("[data-kind]")].map(el=>el.dataset.kind==="wall"?{kind:"wall",x1:+el.dataset.x1,y1:+el.dataset.y1,x2:+el.dataset.x2,y2:+el.dataset.y2}:{kind:"item",type:el.dataset.type,x:parseInt(el.style.left),y:parseInt(el.style.top),rotation:+el.dataset.rotation,w:el.offsetWidth,h:el.offsetHeight,label:el.dataset.label,color:el.dataset.color})};
}


function loadLayoutData(data){[...room.querySelectorAll("[data-kind]")].forEach(e=>e.remove());data.forEach(i=>i.kind==="wall"?addWall(i.x1,i.y1,i.x2,i.y2):addItem(i.type,i.x,i.y,i.rotation,i.w,i.h,i.label,i.color));updateLegend()}
function downloadLayout(){
 const data=JSON.stringify(getLayoutData(),null,2),blob=new Blob([data],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download=(document.getElementById("mapTitle").value||"room-layout").replaceAll(" ","-")+".json";a.click();URL.revokeObjectURL(a.href);
}
function loadFromFile(event){
 const file=event.target.files[0];if(!file)return;
 const reader=new FileReader();reader.onload=e=>{const data=JSON.parse(e.target.result);document.getElementById("mapTitle").value=data.title||"Room Layout";updateTitle();loadLayoutData(data.items||[])};reader.readAsText(file);
}
function toggleMeasurements(){measurementsVisible=!measurementsVisible;document.querySelectorAll(".length").forEach(el=>el.style.display=measurementsVisible?"block":"none")}
function clearLayout(){if(confirm("Clear layout?")){[...room.querySelectorAll("[data-kind]")].forEach(e=>e.remove());updateLegend()}}
</script>
</body>
</html>
